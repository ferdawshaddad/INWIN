name: inwin_app
description: INWIN - From Idea to Realisation. Corporate gifts and events platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.18

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # File handling
  image_picker: ^1.1.2
  file_picker: ^8.0.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.1.2
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  pdf: ^3.11.1
  printing: ^5.13.1
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo inwin final.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
